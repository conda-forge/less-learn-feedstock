{% set name = "less-learn" %}
{% set version = "0.5.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: abd13ac1d3a9d7ebb301e8485afb5af344436e5491398792031e93ae8665ced8

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - numpy >=1.21.5
    - python >=3.6
    - scikit-learn >=1.0.1

test:
  imports:
    - less
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/sibirbil/LESS
  summary: Learning with Subset Stacking
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - sibirbil
